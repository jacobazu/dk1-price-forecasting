# daily forecast and dashboard

name: Daily DK1 forecast

on:
  schedule:
    # 10:15 danish time in summer and winter: the first of these that is after 10:00 danish time
    # makes the forecast (entso-e load forecasts are published by 10:00), the other one is skipped
    - cron: "15 8 * * *"
    - cron: "15 9 * * *"
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [master]     # master only
    paths:
      - "index.qmd"
      - "theme.scss"
      - "results/**"

permissions:
  contents: write          # commit forecast
  pages: write             # publish dashboard
  id-token: write

jobs:
  # scheduled runs: only after 10:00 danish time, and only if tomorrow has no forecast yet
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          hour=$(TZ=Europe/Copenhagen date +%-H)
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then go=true
          elif [ "$hour" -lt 10 ]; then go=false
          elif grep -q ",$target," forecasts/forecasts_live.csv; then go=false
          else go=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "danish hour $hour, forecast for $target: run = $go"

  forecast:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # r version from renv.lock
      - uses: r-lib/actions/setup-r@v2
        if: hashFiles('renv.lock') != ''
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-r@v2
        if: hashFiles('renv.lock') == ''
        with:
          use-public-rspm: true

      # packages from renv.lock
      - name: Install R packages (renv)
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      # fallback without renv.lock
      - name: Install R packages
        if: hashFiles('renv.lock') == ''
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "tidyr", "lubridate", "glmnet", "ggplot2", "plotly", "readr", "knitr", "rmarkdown"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Update prices, neighbour prices, weather and load forecasts
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: Rscript scripts/01_update_live.R

      - name: Forecast tomorrow
        if: github.event_name != 'push'
        run: Rscript scripts/05_forecast_tomorrow.R

      # backtest + live days
      - name: Evaluate forecasts and battery
        if: github.event_name != 'push'
        continue-on-error: true   # forecast saved anyway
        run: |
          Rscript scripts/10_evaluate.R
          Rscript scripts/11_battery.R

      - name: Save forecast and results to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/forecasts_live.csv live/ results/
          # tomorrow in danish time
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          if git diff --cached --quiet -- forecasts/forecasts_live.csv; then
            msg="Prices updated, forecast for $target was already saved"
          else
            msg="Forecast for delivery day $target, made $(date -u '+%F %H:%M') UTC"
          fi
          git commit -m "$msg" || echo "Nothing new to commit"
          git pull --rebase origin master   # in case of new commits
          git push

      - name: Build dashboard
        run: |
          quarto render index.qmd
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5