# every morning: update the data, forecast tomorrow, evaluate, rebuild the dashboard

name: Daily DK1 forecast

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 09:00/10:00 Danish time
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [master]     # only master rebuilds the site
    paths:
      - "index.qmd"
      - "theme.scss"
      - "results/**"

permissions:
  contents: write          # to commit the new forecast
  pages: write             # to publish the dashboard
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # same R version as in renv.lock, or the latest R if there is no lockfile yet
      - uses: r-lib/actions/setup-r@v2
        if: hashFiles('renv.lock') != ''
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-r@v2
        if: hashFiles('renv.lock') == ''
        with:
          use-public-rspm: true

      # packages from renv.lock (same versions as on my pc)
      - name: Install R packages (renv)
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      # fallback if there is no renv.lock yet
      - name: Install R packages
        if: hashFiles('renv.lock') == ''
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "tidyr", "lubridate", "glmnet", "ggplot2", "plotly", "readr", "knitr", "rmarkdown"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Update prices, neighbour prices and weather (rolling 2-year window)
        run: Rscript scripts/01_update_live.R

      - name: Forecast tomorrow
        if: github.event_name != 'push'
        run: Rscript scripts/05_forecast_tomorrow.R

      # backtest + live days, grows by one day every morning
      - name: Evaluate forecasts and battery
        if: github.event_name != 'push'
        continue-on-error: true   # the forecast is still saved if this fails
        run: |
          Rscript scripts/10_evaluate.R
          Rscript scripts/11_battery.R

      - name: Save forecast and results to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/forecasts_live.csv live/prices_dk1_live.csv live/neighbours_live.csv live/weather_live.csv results/
          # same target day as in 05_forecast_tomorrow.R: tomorrow in danish time
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          if git diff --cached --quiet -- forecasts/forecasts_live.csv; then
            msg="Prices updated, forecast for $target was already saved"
          else
            msg="Forecast for delivery day $target, made $(date -u '+%F %H:%M') UTC"
          fi
          git commit -m "$msg" || echo "Nothing new to commit"
          git pull --rebase origin master   # in case something else was pushed during the run
          git push

      - name: Build dashboard
        run: |
          quarto render index.qmd
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5