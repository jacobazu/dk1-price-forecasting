# idea: every morning; download prices, forecast tomorrow, save the forecast, rebuild the dashboard.

name: Daily DK1 forecast

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 09:00/10:00 Danish time
  workflow_dispatch:       # "Run workflow" button

permissions:
  contents: write          # to commit the new forecast
  pages: write             # to publish the dashboard
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "tidyr", "lubridate", "glmnet", "ggplot2", "plotly", "readr", "knitr", "rmarkdown"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Download and clean prices
        run: |
          mkdir -p data/raw data/processed
          Rscript scripts/01_download.R
          Rscript scripts/02_clean.R

      - name: Forecast tomorrow
        run: Rscript scripts/05_forecast_tomorrow.R

      - name: Save forecast to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/forecasts_live.csv
          git commit -m "Forecast for $(date -u -d tomorrow +%F)" || echo "Nothing new to commit"
          git push

      - name: Build dashboard
        run: |
          quarto render index.qmd
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4