# idea: every morning; download prices, forecast tomorrow, save the forecast, rebuild the dashboard.

name: Daily DK1 forecast

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 09:00/10:00 Danish time
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [master]     # only master rebuilds the site
    paths:
      - "index.qmd"
      - "vision.scss"

permissions:
  contents: write          # to commit the new forecast
  pages: write             # to publish the dashboard
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # packages from renv.lock (same versions as on my pc)
      - name: Install R packages (renv)
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      # fallback if there is no renv.lock yet
      - name: Install R packages
        if: hashFiles('renv.lock') == ''
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "tidyr", "lubridate", "glmnet", "ggplot2", "plotly", "readr", "knitr", "rmarkdown"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Update price data (rolling 2-year window)
        run: Rscript scripts/01_update_live.R

      - name: Forecast tomorrow
        if: github.event_name != 'push'
        run: Rscript scripts/05_forecast_tomorrow.R

      - name: Save forecast to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/forecasts_live.csv live/prices_dk1_live.csv
          git commit -m "Forecast and prices for $(date -u -d tomorrow +%F)" || echo "Nothing new to commit"
          git push

      - name: Build dashboard
        run: |
          quarto render index.qmd
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5