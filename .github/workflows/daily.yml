# daily forecast and dashboard

name: Daily DK1 forecast

on:
  schedule:
    # 10:15 danish time in summer and winter: the first of these that is after 10:00 danish time
    # makes the forecast (entso-e load forecasts are published by 10:00), the other one is skipped
    - cron: "15 8 * * *"
    - cron: "15 9 * * *"
    # afternoon refresh: nord pool publishes tomorrow's prices about 13:00 danish time. every 20 minutes from then
    # the gate asks energi data service whether they are out; the first run that finds them fetches them and
    # rebuilds the dashboard (no forecast), and the rest of the day's runs stop at the gate. so a late nord pool
    # just means a later rebuild, and a late or skipped github run is covered by the next one
    - cron: "*/20 11-21 * * *"
  workflow_dispatch:       # "Run workflow" button. the outside scheduler (cron-job.org) sends scheduled = true
                           # at 10:15, 10:45 and 11:15 danish time
    inputs:
      scheduled:
        description: "Started by the scheduler: same checks as a scheduled run"
        type: boolean
        default: false
  push:
    branches: [master]     # master only
    paths:
      - ".github/workflows/daily.yml"
      - "index.qmd"
      - "backtest.qmd"
      - "R/dashboard_setup.R"
      - "theme.scss"
      - "results/**"

permissions:
  contents: write          # commit forecast
  pages: write             # publish dashboard
  id-token: write

# one run at a time: if the scheduler and github's own timer start at the same minute, the second waits,
# then sees tomorrow's forecast and skips
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # scheduled runs: only between 10:00 and 11:45 danish time (the forecast has to be saved before the noon
  # auction, a run takes about 4 minutes), and only if tomorrow has no forecast yet
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      # the latest commit, not the one from when the run was queued
      - uses: actions/checkout@v7
        with:
          ref: master
      - id: check
        run: |
          now=$(TZ=Europe/Copenhagen date +%H%M)
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          mode=forecast
          if [ "${{ github.event_name }}" = "push" ]; then go=true; mode=refresh
          elif [ "${{ github.event_name == 'schedule' || inputs.scheduled }}" != "true" ]; then go=true
          elif [ "$now" -ge 1300 ]; then
            # afternoon: rebuild once, as soon as all of tomorrow's dk1 prices are published
            mode=refresh
            if [ "$(cat live/prices_shown.txt 2>/dev/null)" = "$target" ]; then go=false; echo "prices for $target already on the page"
            else
              n=$(curl -s -m 60 --retry 3 "https://api.energidataservice.dk/dataset/DayAheadPrices?start=$(date -d "$target -1 day" +%F)&end=$(date -d "$target +2 day" +%F)&filter=%7B%22PriceArea%22:%5B%22DK1%22%5D%7D&limit=0" \
                | jq --arg d "$target" '[.records[] | select((.TimeDK | startswith($d)) and .DayAheadPriceEUR != null)] | length' 2>/dev/null || echo 0)
              echo "dk1 prices published for $target: ${n:-0} quarter-hours"
              if [ "${n:-0}" -ge 92 ]; then go=true; else go=false; fi
            fi
          elif [ "$now" -lt 1000 ]; then go=false
          elif [ "$now" -ge 1145 ]; then go=false
          elif grep -q ",$target," forecasts/forecasts_live.csv; then go=false
          else go=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "danish time $now, forecast for $target: run = $go, $mode"

  forecast:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    # a stuck run must end in time for the 10:45 retry, not hang for hours
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      # github's own ubuntu mirror (azure.archive.ubuntu.com) has been failing to resolve or crawling since late
      # oct 2026 (actions/runner-images#15142), which left the r setup hanging for hours. use other mirrors instead
      - name: Ubuntu mirrors
        run: |
          printf 'http://ftp.uni-stuttgart.de/ubuntu/\nhttp://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts

      # r version from renv.lock
      - uses: r-lib/actions/setup-r@v2
        if: hashFiles('renv.lock') != ''
        timeout-minutes: 25
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-r@v2
        if: hashFiles('renv.lock') == ''
        with:
          use-public-rspm: true

      # packages from renv.lock
      - name: Install R packages (renv)
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      # fallback without renv.lock
      - name: Install R packages
        if: hashFiles('renv.lock') == ''
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "dplyr", "tidyr", "lubridate", "glmnet", "ggplot2", "plotly", "readr", "knitr", "rmarkdown"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Update prices, neighbour prices, weather and load forecasts
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: Rscript scripts/01_update_live.R

      - name: Forecast tomorrow
        if: needs.gate.outputs.mode == 'forecast'
        run: Rscript scripts/05_forecast_tomorrow.R

      # chronos-2 and the plain pytorch network from the model comparison, saved next to the forecast, not shown.
      # a failure here never touches the forecast itself
      - uses: actions/setup-python@v6
        if: needs.gate.outputs.mode == 'forecast'
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        if: needs.gate.outputs.mode == 'forecast'
        with:
          path: ~/.cache/huggingface
          key: chronos-2
      - name: Python challengers
        if: needs.gate.outputs.mode == 'forecast'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy pandas scikit-learn chronos-forecasting==2.3.2 \
            "git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff"
          THREADS=4 python bakeoff/live.py tmp_py/daily.csv

      # backtest + live days
      - name: Evaluate forecasts and battery
        if: needs.gate.outputs.mode == 'forecast'
        continue-on-error: true   # forecast saved anyway
        run: |
          Rscript scripts/10_evaluate.R
          Rscript scripts/11_battery.R
          Rscript scripts/12_battery_risk.R

      - name: Save forecast and results to the repository
        if: needs.gate.outputs.mode == 'forecast'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/ live/ results/
          # tomorrow in danish time
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          if git diff --cached --quiet -- forecasts/forecasts_live.csv; then
            msg="Prices updated, forecast for $target was already saved"
          else
            msg="Forecast for delivery day $target, made $(date -u '+%F %H:%M') UTC"
          fi
          git commit -m "$msg" || echo "Nothing new to commit"
          # a short glitch at github can make the push fail: three tries
          for try in 1 2 3; do
            if git pull --rebase origin master && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "saving failed (try $try), trying again in 20 seconds"
            sleep 20
          done
          exit 1

      - name: Build dashboard
        run: |
          quarto render index.qmd
          quarto render backtest.qmd
          mkdir -p _site
          cp index.html backtest.html desk.json _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # the afternoon refresh made it onto the page: note the day, so the rest of today's runs stop at the gate
  mark:
    needs: [gate, deploy]
    if: needs.gate.outputs.mode == 'refresh' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - run: |
          TZ=Europe/Copenhagen date -d tomorrow +%F > live/prices_shown.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/prices_shown.txt
          git commit -m "Actual prices for $(cat live/prices_shown.txt) on the dashboard" || exit 0
          for try in 1 2 3; do
            if git pull --rebase origin master && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1
