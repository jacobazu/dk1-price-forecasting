# checks that the day's forecasts were made. a failed run means github sends an email.
# started by the outside scheduler at 10:50 (price forecast only, still time to run it by hand before the
# auction) and 11:40 danish time (everything). the cron below is a backup

name: Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * *"    # 11:40 summer time, 10:40 winter time

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the forecasts
        run: |
          raw=https://raw.githubusercontent.com/jacobazu
          now=$(TZ=Europe/Copenhagen date +%H%M)
          tomorrow=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          fail=0

          if curl -sf "$raw/dk1-price-forecasting/master/forecasts/forecasts_live.csv" | grep -q ",$tomorrow,"; then
            echo "price forecast for $tomorrow: ok"
          else
            echo "::error::No price forecast for $tomorrow. Run 'Daily DK1 forecast' by hand before 11:45."
            fail=1
          fi

          # the rest is only due later in the morning
          if [ "$now" -ge 1130 ]; then
            if curl -sf "$raw/dk1-imbalance-forecasting/master/forecasts/da_imbalance_log.csv" | grep -q ",$tomorrow,"; then
              echo "day-ahead to imbalance positions for $tomorrow: ok"
            else
              echo "::error::No day-ahead to imbalance positions for $tomorrow."
              fail=1
            fi
            last=$(curl -sf "$raw/dk1-imbalance-forecasting/master/forecasts/intraday_log.csv" | tail -1 | cut -d, -f1)
            age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
            if [ "$age" -le 180 ]; then
              echo "imbalance forecast made $age minutes ago: ok"
            else
              echo "::error::The last imbalance forecast is $age minutes old (made $last UTC)."
              fail=1
            fi
          fi
          exit $fail
