# checks that the day's forecasts were made. a failed run means github sends an email, so it fails only when
# something needs doing by hand or has stopped working; a gap that can no longer be fixed is a warning.
# the workflows that run many times a day send no email of their own: this check is their alarm.
# started by the outside scheduler at 10:50 (price forecast only, still time to run it by hand before the
# auction) and 11:50 danish time (everything). the cron below is a backup

name: Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * *"    # 11:40 summer time, 10:40 winter time

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the forecasts
        run: |
          raw=https://raw.githubusercontent.com/jacobazu
          now=$(TZ=Europe/Copenhagen date +%H%M)
          tomorrow=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          fail=0

          if curl -sf "$raw/dk1-price-forecasting/master/forecasts/forecasts_live.csv" | grep -q ",$tomorrow,"; then
            echo "price forecast for $tomorrow: ok"
          else
            echo "::error::No price forecast for $tomorrow. Run 'Daily DK1 forecast' by hand before 11:45."
            fail=1
          fi

          # the rest is only due later in the morning
          if [ "$now" -ge 1130 ]; then
            if curl -sf "$raw/dk1-imbalance-forecasting/master/forecasts/da_imbalance_log.csv" | grep -q ",$tomorrow,"; then
              echo "day-ahead to imbalance positions for $tomorrow: ok"
            else
              echo "::error::No day-ahead to imbalance positions for $tomorrow."
              fail=1
            fi
            last=$(curl -sf "$raw/dk1-imbalance-forecasting/master/forecasts/intraday_log.csv" | tail -1 | cut -d, -f1)
            age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
            # energinet's live data is sometimes an hour or two late, and then no forecast is made: a few hours
            # without one is a warning, eight hours means the runs have stopped
            if [ "$age" -le 180 ]; then
              echo "imbalance forecast made $age minutes ago: ok"
            elif [ "$age" -le 480 ]; then
              echo "::warning::The last imbalance forecast is $age minutes old (made $last UTC), probably late data."
            else
              echo "::error::The last imbalance forecast is $age minutes old (made $last UTC). The live runs have stopped."
              fail=1
            fi
          fi

          # offshore wind forecast for tomorrow (renewables repo, saved before the auction)
          if [ "$now" -ge 1130 ]; then
            if curl -sf "$raw/dk1-renewables-forecasting/main/forecasts/live_forecasts.csv" | grep -q ",$tomorrow,"; then
              echo "offshore wind forecast for $tomorrow: ok"
            else
              echo "::error::No offshore wind forecast for $tomorrow. Run 'Live forecast' in dk1-renewables-forecasting before 12:00."
              fail=1
            fi
            if curl -sf "$raw/dk1-renewables-forecasting/main/forecasts/capture_live.csv" | grep -q "^$tomorrow,"; then
              echo "capture price for $tomorrow: ok"
            else
              echo "::warning::No capture price for $tomorrow yet (it needs the wind and the price forecast)."
            fi
          fi

          # battery: tomorrow's reserve capacity, saved before energinet's 07:30 auctions. by the time this runs a
          # missing day can no longer be saved, so one gap is a warning; two days in a row means the runs are broken
          cap=$(curl -sf "$raw/dk1-battery-trade/main/opportunity/live_capacity.csv")
          today=$(TZ=Europe/Copenhagen date +%F)
          if echo "$cap" | grep -q ",$tomorrow,"; then
            echo "battery reserve capacity for $tomorrow: ok"
          elif echo "$cap" | grep -q ",$today,"; then
            echo "::warning::No battery reserve capacity for $tomorrow. It can only be saved before 07:25; the day is a gap."
          else
            echo "::error::No battery reserve capacity for $tomorrow or $today. Check 'opportunity live' in dk1-battery-trade."
            fail=1
          fi

          # the published pages, not only the forecasts: each page carries the time it was built
          for page in "dk1-price-forecasting 30" "dk1-battery-trade 30" "dk1-imbalance-forecasting 3"; do
            set -- $page
            built=$(curl -sf "https://jacobazu.github.io/$1/" | grep -oE '(name="built" content|data-built)="[^"]+"' | head -1 | sed -E 's/.*="([^"]+)"$/\1/')
            if [ -z "$built" ]; then
              echo "::warning::$1: no build time on the page"
              continue
            fi
            hours=$(( ($(date -u +%s) - $(date -u -d "$built" +%s)) / 3600 ))
            if [ "$hours" -le "$2" ]; then
              echo "$1 page built $hours hours ago: ok"
            else
              echo "::error::The $1 page was last built $built ($hours hours ago). Check its deploy."
              fail=1
            fi
          done
          exit $fail
